<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>รับคูปองส่วนลด - Isan Fries</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library สร้าง QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Library แปลง HTML เป็นรูปภาพ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* ปรับ Scale ของตั๋วอัตโนมัติสำหรับหน้าจอที่แคบกว่า 340px (เช่น iPhone SE รุ่นเก่า) */
    @media (max-width: 340px) {
      #cardScaler {
        transform: scale(0.9);
        transform-origin: top center;
        margin-bottom: -45px;
      }
    }
  </style>
</head>
<body class="bg-[#dcd6f7] min-h-screen flex items-center justify-center p-3 sm:p-6">

  <!-- Main Container -->
  <div class="bg-white rounded-3xl shadow-xl w-full max-w-[360px] sm:max-w-sm p-4 sm:p-6 text-center flex flex-col items-center">
    
    <!-- ส่วนหัวหน้าเว็บ -->
    <h1 class="text-lg sm:text-xl font-black text-slate-800 tracking-wide uppercase">ISAN FRIES</h1>
    <p class="text-slate-400 text-[11px] sm:text-xs mt-0.5">11.11 ลด 11 บาท ค้าบบบบบ</p>

    <!-- ป้ายบอกจำนวนสิทธิ์คงเหลือ -->
    <div class="my-3 sm:my-4 py-2 px-4 sm:px-5 bg-slate-50 rounded-2xl border border-slate-200 w-full flex items-center justify-between">
      <span class="text-[11px] sm:text-xs uppercase tracking-wider text-slate-400 font-bold">สิทธิ์คงเหลือ</span>
      <div id="quotaDisplay" class="text-lg sm:text-xl font-black text-[#1e1b4b]">กำลังโหลด...</div>
    </div>

    <!-- Scaler Wrapper ป้องกันหน้าจอล้นในมือถือขนาดเล็ก -->
    <div id="cardScaler" class="w-full flex justify-center my-1 select-none">
      
      <!-- การ์ดคูปอง: ขนาดล็อก 310 x 510 px สำหรับ Export รูปภาพ -->
      <div id="couponCard" style="width: 310px; height: 510px; background-color: #ffffff;" 
           class="rounded-3xl shadow-lg relative overflow-hidden border border-slate-100 flex flex-col justify-between items-center text-center">
        
        <!-- ส่วนบน: แบรนด์และตัวเลขส่วนลด 11฿ OFF -->
        <div class="pt-4 px-5 w-full flex flex-col items-center">
          <span class="text-3xl mb-0.5">🔥</span>
          <h3 class="text-xs font-black tracking-widest text-slate-400 uppercase">ISAN FRIED</h3>
          <p class="text-[10px] font-medium text-slate-500 mt-0.5">Exclusive Discount Coupon</p>

          <div class="my-2">
            <div class="flex items-baseline justify-center">
              <span class="text-6xl font-black text-[#1e1b4b] tracking-tighter leading-none">11</span>
              <span class="text-3xl font-black text-[#1e1b4b] ml-1">฿</span>
            </div>
            <div class="text-base font-black tracking-[0.35em] text-[#1e1b4b] mt-0.5 uppercase">
              OFF
            </div>
          </div>

          <p class="text-[9px] text-slate-400 font-medium">*สแกนใช้สิทธิ์เฉพาะหน้าร้านเท่านั้น*</p>
        </div>

        <!-- รอยต่อตั๋ว: รอยเว้าซ้าย-ขวา + เส้นประ -->
        <div class="w-full relative flex items-center justify-center">
          <div class="w-6 h-6 bg-[#dcd6f7] rounded-full absolute -left-3"></div>
          <div class="w-[78%] border-b-2 border-dashed border-slate-200"></div>
          <div class="w-6 h-6 bg-[#dcd6f7] rounded-full absolute -right-3"></div>
        </div>

        <!-- ส่วนล่าง: QR Code, คำเตือน และ Badge รหัส -->
        <div class="pb-5 px-4 w-full flex flex-col items-center">
          <span class="text-[10px] text-slate-400 font-semibold mb-1.5">แสดง QR Code นี้แก่พนักงาน</span>
          
          <div id="qrCodeContainer" class="p-2 bg-white border border-slate-100 rounded-2xl shadow-sm mb-2 w-[126px] h-[126px] flex items-center justify-center">
            <span class="text-[10px] text-slate-300 font-mono">WAITING</span>
          </div>

          <!-- กล่องเตือนใต้ QR Code -->
          <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-amber-50 border border-amber-200/80 text-amber-800 text-[10px] font-semibold leading-none mb-2">
            <span>⚠️</span>
            <span>โปรดแคปหน้าจอเก็บไว้ เพื่อนำมาแสดงสิทธิ์หน้าร้าน</span>
          </div>

          <!-- กล่องรหัสคูปอง -->
          <div class="inline-block bg-[#facc15] text-[#1e1b4b] px-4 py-1.5 rounded-lg font-mono font-black text-xs tracking-wider shadow-sm">
            CODE: <span id="couponCodeText">------</span>
          </div>
        </div>

      </div>
    </div>

    <!-- ข้อความแจ้งเตือนกรณีสิทธิ์หมด -->
    <div id="soldOutMsg" class="hidden text-rose-500 font-bold my-2 text-xs sm:text-sm">
      ขออภัย สิทธิ์คูปองถูกแจกหมดแล้ว (Sold Out)
    </div>

    <!-- ปุ่มดาวน์โหลดคูปอง -->
    <button id="claimBtn" onclick="claimCoupon()" disabled 
      class="mt-3 w-full py-3 sm:py-3.5 px-4 bg-[#1e1b4b] hover:bg-slate-900 disabled:bg-slate-200 disabled:text-slate-400 text-white text-sm sm:text-base font-bold rounded-2xl shadow-md transition duration-200">
      ดาวน์โหลดคูปอง
    </button>
  </div>

  <script>
    // ** Web App URL ของ Google Apps Script **
    const API_URL = "https://script.google.com/macros/s/AKfycbzXSeu4g8RzhXwceHTULZNBEQ8P9dzjG49IDZCc6WqRqwVbzQw04cCObKO4nPzVke5Nlg/exec";

    async function fetchQuota() {
      try {
        const res = await fetch(`${API_URL}?action=getQuota`);
        const data = await res.json();
        
        document.getElementById('quotaDisplay').innerText = `${data.remaining} / ${data.total}`;

        if (data.remaining > 0) {
          document.getElementById('claimBtn').disabled = false;
        } else {
          showSoldOut();
        }
      } catch (err) {
        document.getElementById('quotaDisplay').innerText = "ขัดข้อง";
      }
    }

    function showSoldOut() {
      document.getElementById('claimBtn').classList.add('hidden');
      document.getElementById('soldOutMsg').classList.remove('hidden');
      document.getElementById('quotaDisplay').innerText = "0 / 15";
    }

    async function claimCoupon() {
      const btn = document.getElementById('claimBtn');
      btn.disabled = true;
      btn.innerText = "กำลังออกคูปอง...";

      try {
        const res = await fetch(`${API_URL}?action=claimCoupon`);
        const data = await res.json();

        if (data.status === 'success') {
          const code = data.code;
          
          // 1. ใส่รหัสลงใน Badge
          document.getElementById('couponCodeText').innerText = code;

          // 2. สร้าง QR Code ขนาด 110x110 px
          const verifyUrl = `${window.location.origin}${window.location.pathname.replace('index.html', '')}verify.html?code=${code}`;
          const qrContainer = document.getElementById('qrCodeContainer');
          qrContainer.innerHTML = "";
          new QRCode(qrContainer, {
            text: verifyUrl,
            width: 110,
            height: 110,
            colorDark: "#1e1b4b",
            colorLight: "#FFFFFF",
            correctLevel: QRCode.CorrectLevel.M
          });

          // รอให้ DOM วาด QR Code สมบูรณ์
          await new Promise(r => setTimeout(r, 250));

          // 3. รีเซ็ต Transform ชั่วคราวเพื่อให้คำนวณขนาดภาพคงที่
          const scaler = document.getElementById('cardScaler');
          const currentTransform = scaler.style.transform;
          scaler.style.transform = "none";

          const cardElement = document.getElementById('couponCard');
          const canvas = await html2canvas(cardElement, { 
            scale: 3,
            useCORS: true,
            backgroundColor: null,
            width: 310,
            height: 510,
            scrollX: 0,
            scrollY: 0
          });

          // คืนค่า Scale หน้าจอ
          scaler.style.transform = currentTransform;

          // 4. บันทึก/ดาวน์โหลดรูปภาพ (รองรับ Safari iOS และ Browser ทั่วไป)
          canvas.toBlob(async (blob) => {
            const fileName = `IsanFried-Coupon-${code}.png`;
            const file = new File([blob], fileName, { type: "image/png" });

            // ตรวจสอบ Web Share API (สำหรับ Safari บน iPhone)
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({
                  files: [file],
                  title: 'คูปอง Isan Fried',
                  text: `คูปองส่วนลด 11 บาท รหัส: ${code}`
                });
                btn.innerText = "รับคูปองสำเร็จแล้ว";
              } catch (shareErr) {
                // ผู้ใช้กดยกเลิกหน้าต่าง Share ให้เตือนแคปหน้าจอแทน
                btn.innerText = "โปรดแคปหน้าจอไว้";
              }
            } else {
              // วิธีดาวน์โหลดปกติสำหรับ PC หรือ Browser ทั่วไป
              const blobUrl = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = blobUrl;
              link.download = fileName;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              URL.revokeObjectURL(blobUrl);
              btn.innerText = "ดาวน์โหลดสำเร็จแล้ว";
            }
          }, "image/png");

          fetchQuota();
        } else {
          showSoldOut();
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการรับสิทธิ์ กรุณาลองใหม่อีกครั้ง");
        btn.disabled = false;
        btn.innerText = "ดาวน์โหลดคูปอง";
      }
    }

    fetchQuota();
  </script>
</body>
</html>
