<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รับคูปองส่วนลด - Isan Fried</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library สร้าง QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Library แปลง HTML เป็นรูปภาพ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-[#dcd6f7] min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-3xl shadow-xl max-w-sm w-full p-6 text-center flex flex-col items-center">
    
    <!-- ส่วนหัวหน้าเว็บ -->
    <h1 class="text-xl font-black text-slate-800 tracking-wide uppercase">ISAN FRIED</h1>
    <p class="text-slate-400 text-xs mt-0.5">กิจกรรมแจกคูปองส่วนลดพิเศษหน้าร้าน</p>

    <!-- ป้ายบอกจำนวนสิทธิ์คงเหลือ -->
    <div class="my-4 py-2 px-5 bg-slate-50 rounded-2xl border border-slate-200 w-full flex items-center justify-between">
      <span class="text-xs uppercase tracking-wider text-slate-400 font-bold">สิทธิ์คงเหลือ</span>
      <div id="quotaDisplay" class="text-xl font-black text-[#1e1b4b]">กำลังโหลด...</div>
    </div>

    <!-- การ์ดคูปอง: ล็อกขนาดตายตัว 310 x 510 px เพื่อให้ html2canvas คำนวณตรงเป๊ะ ไม่ยืด -->
    <div class="my-2 select-none">
      <div id="couponCard" style="width: 310px; height: 510px; background-color: #ffffff;" 
           class="rounded-3xl shadow-lg relative overflow-hidden border border-slate-100 flex flex-col justify-between items-center text-center">
        
        <!-- ส่วนบน: แบรนด์และตัวเลขส่วนลด 11฿ OFF -->
        <div class="pt-6 px-5 w-full flex flex-col items-center">
          <span class="text-3xl mb-1">🔥</span>
          <h3 class="text-xs font-black tracking-widest text-slate-400 uppercase">ISAN FRIED</h3>
          <p class="text-[10px] font-medium text-slate-500 mt-0.5">Exclusive Discount Coupon</p>

          <div class="my-3">
            <div class="flex items-baseline justify-center">
              <span class="text-6xl font-black text-[#1e1b4b] tracking-tighter leading-none">11</span>
              <span class="text-3xl font-black text-[#1e1b4b] ml-1">฿</span>
            </div>
            <div class="text-base font-black tracking-[0.35em] text-[#1e1b4b] mt-1 uppercase">
              OFF
            </div>
          </div>

          <p class="text-[9px] text-slate-400 font-medium">*สแกนรับสิทธิ์เฉพาะหน้าร้านเท่านั้น</p>
        </div>

        <!-- รอยต่อตั๋ว: รอยเว้าซ้าย-ขวา + เส้นประ -->
        <div class="w-full relative flex items-center justify-center">
          <div class="w-6 h-6 bg-[#dcd6f7] rounded-full absolute -left-3"></div>
          <div class="w-[78%] border-b-2 border-dashed border-slate-200"></div>
          <div class="w-6 h-6 bg-[#dcd6f7] rounded-full absolute -right-3"></div>
        </div>

        <!-- ส่วนล่าง: QR Code และ Badge รหัส -->
        <div class="pb-6 px-5 w-full flex flex-col items-center">
          <span class="text-[10px] text-slate-400 font-semibold mb-2">แสดง QR Code นี้แก่พนักงาน</span>
          
          <!-- กล่องใส่ QR Code ขนาดตายตัว -->
          <div id="qrCodeContainer" class="p-2 bg-white border border-slate-100 rounded-2xl shadow-sm mb-3 w-[126px] h-[126px] flex items-center justify-center">
            <span class="text-[10px] text-slate-300 font-mono">WAITING</span>
          </div>

          <!-- กล่องรหัสคูปอง -->
          <div class="inline-block bg-[#facc15] text-[#1e1b4b] px-4 py-1.5 rounded-lg font-mono font-black text-xs tracking-wider shadow-sm">
            CODE: <span id="couponCodeText">------</span>
          </div>
        </div>

      </div>
    </div>

    <!-- ข้อความแจ้งเตือนกรณีสิทธิ์หมด -->
    <div id="soldOutMsg" class="hidden text-rose-500 font-bold my-3 text-sm">
      ขออภัย สิทธิ์คูปองถูกแจกหมดแล้ว (Sold Out)
    </div>

    <!-- ปุ่มดาวน์โหลดคูปอง -->
    <button id="claimBtn" onclick="claimCoupon()" disabled 
      class="mt-3 w-full py-3.5 px-4 bg-[#1e1b4b] hover:bg-slate-900 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold rounded-2xl shadow-md transition duration-200">
      ดาวน์โหลดคูปอง
    </button>
  </div>

  <script>
    // ** ใส่ Web App URL ของคุณที่นี่ **
    const API_URL = "https://script.google.com/macros/s/AKfycbzXSeu4g8RzhXwceHTULZNBEQ8P9dzjG49IDZCc6WqRqwVbzQw04cCObKO4nPzVke5Nlg/exec";

    async function fetchQuota() {
      try {
        const res = await fetch(`${API_URL}?action=getQuota`);
        const data = await res.json();
        
        document.getElementById('quotaDisplay').innerText = `${data.remaining} / ${data.total}`;

        if (data.remaining > 0) {
          document.getElementById('claimBtn').disabled = false;
        } else {
          showSoldOut();
        }
      } catch (err) {
        document.getElementById('quotaDisplay').innerText = "ขัดข้อง";
      }
    }

    function showSoldOut() {
      document.getElementById('claimBtn').classList.add('hidden');
      document.getElementById('soldOutMsg').classList.remove('hidden');
      document.getElementById('quotaDisplay').innerText = "0 / 15";
    }

    async function claimCoupon() {
      const btn = document.getElementById('claimBtn');
      btn.disabled = true;
      btn.innerText = "กำลังออกคูปอง...";

      try {
        const res = await fetch(`${API_URL}?action=claimCoupon`);
        const data = await res.json();

        if (data.status === 'success') {
          const code = data.code;
          
          // 1. นำรหัสไปใส่ใน Badge
          document.getElementById('couponCodeText').innerText = code;

          // 2. เรนเดอร์ QR Code ขนาด 110x110 px
          const verifyUrl = `${window.location.origin}${window.location.pathname.replace('index.html', '')}verify.html?code=${code}`;
          const qrContainer = document.getElementById('qrCodeContainer');
          qrContainer.innerHTML = "";
          new QRCode(qrContainer, {
            text: verifyUrl,
            width: 110,
            height: 110,
            colorDark: "#1e1b4b",
            colorLight: "#FFFFFF",
            correctLevel: QRCode.CorrectLevel.M
          });

          // หน่วงเวลาให้เบราว์เซอร์วาด DOM และ QR Code ครบถ้วน
          await new Promise(r => setTimeout(r, 250));

          // 3. ใช้ html2canvas แปลงภาพโดยล็อกความกว้าง-สูงตายตัว
          const cardElement = document.getElementById('couponCard');
          const canvas = await html2canvas(cardElement, { 
            scale: 3,                  // ความคมชัดระดับ 3x HD
            useCORS: true,
            backgroundColor: null,
            width: 310,                // ล็อกตามความกว้างจริง
            height: 510,               // ล็อกตามความสูงจริง
            scrollX: 0,
            scrollY: 0
          });

          // 4. สั่งดาวน์โหลดภาพ .png
          const link = document.createElement('a');
          link.download = `IsanFried-Coupon-${code}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();

          btn.innerText = "บันทึกคูปองสำเร็จแล้ว";
          fetchQuota();
        } else {
          showSoldOut();
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการรับสิทธิ์ กรุณาลองใหม่อีกครั้ง");
        btn.disabled = false;
        btn.innerText = "ดาวน์โหลดคูปอง";
      }
    }

    fetchQuota();
  </script>
</body>
</html>
